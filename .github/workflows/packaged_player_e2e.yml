name: Packaged player E2E (Windows)

# =============================================================================
# 打包 -> 独立 Player -> 呈现帧 -> 自动退出，一条命令的端到端回归。
#
# 为什么单独一份 workflow、而且默认只手动触发
# --------------------------------------------
# 这条链要真的启动 ZEditor（打包需要 AssetRegistry，只能在编辑器里跑）和
# ZGame（DX12 窗口 + 渲染线程）。GitHub-hosted Windows runner 没有可用的 GPU，
# DX12 可能只能落到 WARP，甚至根本起不来窗口；在确认 runner 具备 DX12 之前
# 把它挂到每次 push 上，只会制造与代码无关的红灯。所以：
#
#   * 现在：workflow_dispatch 手动触发，本地 / 自托管 DX12 runner 上跑。
#   * 确认 runner 能起 DX12 后：把下面 push 段的注释去掉，它就是一条真正的
#     回归门禁——任何一步坏了，这个 job 立刻变红。
#
# 本地实测（2026-11-05，E:/Engine/ZEngine，VS2022 Debug / DX12）：
#   16 bundle(s) mounted，0 个 ZPak 错误；在一个没有 asset 源树、没有
#   Intermediate/ 的隔离项目里，日志明确 `ReadObjectsFromYaml: ... served from
#   a mounted bundle`、对象图 32 objects，10 帧后 quit，退出码 0，9/9 断言全绿。
#   注意：曾经有过一次「0 bundle mounted 也照样加载关卡」的假绿，原因是 YAML
#   读取绕过 bundle 钩子、回退到源码树；脚本现在把「字节来自 bundle」作为硬断言。
#
# 第四轮（2026-11-05）：安装目录不再由 Python 手工拷贝，而是真的跑
#   `cmake --install build --config Debug --component ZGamePlayer --prefix <dir>`，
#   ZENGINE_PLAYER_PROJECT 指向已打包项目。原先的 install 规则产出 1653 个文件、
#   顶层 0 个 DLL（exe 在根、ZRuntimeShared.dll 在 bin/），Player 根本起不来；
#   现在 61 个文件 / 53 DLL / 3 bundle，本地 20/20 全绿。
#   CPack 也已收敛到同一 component：ZIP 55 文件（骨架）/ 61 文件（含项目），
#   解压后直接启动可跑 OnUpdate；改回 ALL 会因中文文档名无法转 CP437 而打包失败。
#   本 workflow 已在默认分支（2026-11-05 推送），并在 runner 上真实跑过一次：
#   第一步 `./build_windows.bat debug` 即失败于 `CMake Error at CMakeLists.txt:3
#   (project): Generator Visual Studio 17 2022 could not find any instance of
#   Visual Studio.`。根因是 windows-latest 已迁到 Windows Server 2025 / VS2026
#   镜像，而 preset 固定 VS2022；已 pin runs-on: windows-2022 并加 VS 实例诊断。
#   修复后仍需再 dispatch 一次才能判断 runner 的 DX12 / WARP。
#   （本机无 gh CLI / token，匿名 dispatch 返回 403；触发需在 Actions 页面手动。）
#
# 注意：build_windows.bat 默认只构建 ZEditor，ZGame 依赖的 ZPlayer 库必须
# 单独构建，否则链接期找不到 PlayerShell 的符号。
# =============================================================================
on:
  workflow_dispatch:
    inputs:
      frames:
        description: 'Frames to run before the player quits'
        required: false
        default: '60'
  # push:
  #   branches: [main]
  # pull_request:
  #   branches: [main]

jobs:
  packaged-player:
    # 2026-11-05 首次真实 dispatch 失败于 `CMake Error at CMakeLists.txt:3
    # (project): Generator Visual Studio 17 2022 could not find any instance of
    # Visual Studio.`：windows-latest 已迁到 Windows Server 2025 / VS2026 镜像，
    # 而 presets/windows.json 的 windows_visual_studio 预设固定 generator
    # "Visual Studio 17 2022"。windows-2022 仍预装 VS2022 Enterprise + MSVC
    # C++ 工作负载。不要再改回浮动的 windows-latest。
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Fail fast with actual evidence if the image ever drifts again.
      # zbuild.py's old "Found Visual Studio" only checked that vswhere.exe
      # exists -- a VS2026-only image passes that check and still has no VS2022.
      - name: Verify Visual Studio 2022 toolchain
        shell: pwsh
        run: |
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $installer)) { throw "vswhere.exe not found at $installer" }
          $raw = & $installer -all -prerelease -format json -nologo
          if (-not $raw) { throw "vswhere returned no instances" }
          $instances = $raw | ConvertFrom-Json
          $instances | Select-Object displayName, installationVersion, installationPath |
            Format-Table -AutoSize | Out-String | Write-Output
          $vs2022 = $instances | Where-Object {
            $_.installationVersion -like "17.*" -and $_.installationPath
          }
          if (-not $vs2022) {
            throw "No Visual Studio 2022 instance found; windows_visual_studio preset needs generator 'Visual Studio 17 2022'. Keep runs-on: windows-2022."
          }

      - name: Build ZEditor (Debug, DX12 only)
        run: ./build_windows.bat debug

      - name: Build ZPlayer + ZGame
        run: cmake --build build --config Debug --target ZRuntime ZPlayer ZGame --parallel 4

      - name: Packaged player end-to-end
        run: >
          python scripts/verify_packaged_player_e2e.py
          --config debug
          --rhi dx12
          --frames ${{ github.event.inputs.frames || '60' }}

      # The script now invokes the REAL installer (component ZGamePlayer) and
      # asserts on its output, so an install-rule regression turns this job red.
      # The install dir contains NO source assets at all (no .scene, no .ts, no
      # .js, no global JSON, no loose registry JSON): level, config, component
      # JSON, script registry and compiled module must all come from bundles.
      # Requires the configured build tree (build_windows.bat runs configure).
      # Local: 20/20; --stage-mode copy control: 18/18.
      - name: Installed player + script OnUpdate end-to-end
        run: >
          python scripts/verify_player_install_e2e.py
          --config debug
          --rhi dx12
          --frames ${{ github.event.inputs.frames || '60' }}
