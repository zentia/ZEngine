name: Build Linux

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        configuration: [debug, release]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libglvnd-dev \
            libvulkan-dev \
            libvulkan1 \
            glslang-tools \
            spirv-tools \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev

      - name: Build
        run: ./build_linux.sh ${{ matrix.configuration }}
