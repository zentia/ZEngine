name: Smoke Tests

# =============================================================================
# Why this job exists separately from Build Windows/Linux/macOS:
#   every smoke test is opt-in behind its own -DZENGINE_BUILD_*_SMOKE_TEST=ON
#   flag, so the normal build workflows compile the engine and never run a
#   single test. A test nobody runs protects nothing.
#
# Adding a smoke test:
#   1. build it with zengine_add_smoke_test() -- that helper also registers it
#      with CTest (add_test). Registering by hand is fine too, but do it.
#   2. add its -D flag to "Configure" below,
#   3. add its target to "Build smoke tests" below.
#   Skipping step 2 or 3 means it is still not running in CI. A test that is
#   registered but not built fails as "Unable to find executable", so a stale
#   list here turns the job red rather than silently skipping -- verify a new
#   registration locally with `ctest --test-dir <build> -C Release -N`
#   (listing needs no build).
# =============================================================================

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    name: Smoke tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # VULKAN=OFF: runners do not ship VULKAN_SDK, and none of these tests
      # need a backend -- same reasoning as the editor build in build_windows.bat.
      # (VulkanBindlessSmokeTest is therefore not registered at all; its
      # directory returns early when ZENGINE_USE_VULKAN is off.
      # RenderGraphExecuteSmokeTest does include RHI.h, but only for the ten
      # backend signatures: it drives the executor through a stub
      # IRGResourceDevice and never constructs a real RHI.)
      # PAPI_TYPE=quickjs: release would otherwise pull the V8 script backend.
      #
      # Not enabled: ZENGINE_BUILD_WRITE_FAULT_SMOKE_TEST -- it exercises the
      # write-failure reasons from SerializedFile/FileCacherWrite and that
      # plumbing is not in the tree yet (the test is parked as
      # WriteFaultSmokeTest.cpp.pending). Uncomment the flag and the target the
      # moment it lands; a test that is not in this list is a test that does
      # not run.
      #
      # Not enabled: ZENGINE_BUILD_LUMEN_SCENE_GEOMETRY_SMOKE_TEST,
      # ZENGINE_BUILD_LUMEN_RAY_TRACING_SMOKE_TEST,
      # ZENGINE_BUILD_LUMEN_SURFACE_CACHE_SMOKE_TEST,
      # ZENGINE_BUILD_LUMEN_GLOBAL_ILLUMINATION_SMOKE_TEST,
      # ZENGINE_BUILD_LUMEN_RENDER_PASS_WIRING_SMOKE_TEST,
      # ZENGINE_BUILD_LUMEN_REFLECTIONS_SMOKE_TEST -- this job runs with
      # ZENGINE_USE_VULKAN=OFF, and that branch strips
      # Function/Render/Lumen/*.cpp out of ZRuntime, so there is nothing for
      # those tests to link against here. They are configured and run on the
      # hosts that do build Lumen (Apple / Linux / Windows+Vulkan).
      #
      # ZENGINE_BUILD_NANITE_CLUSTER_SMOKE_TEST is enabled here on purpose,
      # unlike the Lumen set: Function/Render/Nanite is never stripped from
      # ZRuntime, so it links with ZENGINE_USE_VULKAN=OFF. It is pure CPU
      # (split -> hierarchy -> geometry bytes) and needs no backend.
      #
      # ZENGINE_BUILD_NANITE_GPU_CULLING_SMOKE_TEST is enabled here too. Its
      # real dispatch section is Apple-only (it needs Metal), but the rest --
      # the C++/GLSL byte contract read out of the shader sources as text, and
      # the NaniteBuildSceneGPUData packing -- runs everywhere and is exactly
      # the part that silently rots on a machine with no GPU.
      #
      # ZENGINE_BUILD_LUMEN_PER_FRAME_BRIDGE_SMOKE_TEST would actually link here
      # (it only touches RenderCommon.h and reads shader sources as text), but
      # it is grouped with the rest of the Lumen set and left out too: it is the
      # guard for the two UpdatePerFrameBuffer implementations, both of which
      # this job compiles out, so running it here would add noise, not signal.
      - name: Configure with smoke tests enabled
        run: >
          cmake -S . -B build_smoke
          -DZENGINE_USE_VULKAN=OFF
          -DPAPI_TYPE=quickjs
          -DZENGINE_BUILD_PPTR_SMOKE_TEST=ON
          -DZENGINE_BUILD_SCHEMA_EVOLUTION_SMOKE_TEST=ON
          -DZENGINE_BUILD_YAML_ROUND_TRIP_SMOKE_TEST=ON
          -DZENGINE_BUILD_REFLECTION_CODEGEN_SMOKE_TEST=ON
          -DZENGINE_BUILD_ASSET_BUNDLE_SMOKE_TEST=ON
          -DZENGINE_BUILD_PLAYER_SETTINGS_SMOKE_TEST=ON
          -DZENGINE_BUILD_ADDRESSABLES_SMOKE_TEST=ON
          -DZENGINE_BUILD_DDC_SMOKE_TEST=ON
          -DZENGINE_BUILD_AI_SMOKE_TEST=ON
          -DZENGINE_BUILD_AUDIO_SMOKE_TEST=ON
          -DZENGINE_BUILD_ANIMATION_SMOKE_TEST=ON
          -DZENGINE_BUILD_ANIMATOR_SMOKE_TEST=ON
          -DZENGINE_BUILD_ANIMATION_PIPELINE_SMOKE_TEST=ON
          -DZENGINE_BUILD_TEXTURE_COMPRESSOR_SMOKE_TEST=ON
          -DZENGINE_BUILD_RENDERGRAPH_SMOKE_TEST=ON
          -DZENGINE_BUILD_RENDERGRAPH_EXECUTE_SMOKE_TEST=ON
          -DZENGINE_BUILD_UNDO_SMOKE_TEST=ON
          -DZENGINE_BUILD_BUILD_CACHE_SMOKE_TEST=ON
          -DZENGINE_BUILD_BINDLESS_SMOKE_TEST=ON
          -DZENGINE_BUILD_RHI_INDIRECT_DRAW_SMOKE_TEST=ON
          -DZENGINE_BUILD_NANITE_CLUSTER_SMOKE_TEST=ON
          -DZENGINE_BUILD_NANITE_CULLING_SMOKE_TEST=ON
          -DZENGINE_BUILD_NANITE_SCENE_WIRING_SMOKE_TEST=ON
          -DZENGINE_BUILD_NANITE_GPU_CULLING_SMOKE_TEST=ON
          -DZENGINE_BUILD_SHADER_REGISTRY_SMOKE_TEST=ON
          -DZENGINE_BUILD_FIXED_TIME_STEP_SMOKE_TEST=ON
          -DZENGINE_BUILD_SCRIPT_TIME_SMOKE_TEST=ON
          -DZENGINE_BUILD_ASSET_PATH_PORTABILITY_SMOKE_TEST=ON
          -DZENGINE_BUILD_GLTF_MESH_IMPORT_SMOKE_TEST=ON
          # Wwise backend gate. CI has no SDK (ZENGINE_WWISE_SDK_DIR unset), so
          # this exercises the "not compiled in" branch: the API must report
          # that honestly instead of pretending. Groups A/B are source-level and
          # need no audio device; group C is skipped unless --with-device.
          -DZENGINE_BUILD_WWISE_SMOKE_TEST=ON
          -DZENGINE_BUILD_CI_COVERAGE_SMOKE_TEST=ON
          -DZENGINE_BUILD_ENVIRONMENT_CHECK_TESTS=ON

      - name: Build smoke tests
        run: >
          cmake --build build_smoke --config Release --parallel 4
          --target
          PlatformTest
          PlatformTestAdvanced
          PlatformTestSimple
          PPtrSmokeTest
          SchemaEvolutionSmokeTest
          YamlRoundTripSmokeTest
          ReflectionCodegenSmokeTest
          AssetBundleSmokeTest
          PlayerSettingsSmokeTest
          AddressablesSmokeTest
          DerivedDataCacheSmokeTest
          AISmokeTest
          NavMeshTest
          AudioMixerSmokeTest
          AnimationSkinningSmokeTest
          AnimatorSmokeTest
          AnimationPipelineSmokeTest
          TextureCompressorSmokeTest
          RenderGraphSmokeTest
          RenderGraphExecuteSmokeTest
          UndoSystemSmokeTest
          BuildCacheSmokeTest
          RHIIndirectDrawSmokeTest
          NaniteClusterBuilderSmokeTest
          NaniteCullingSmokeTest
          NaniteSceneWiringSmokeTest
          NaniteGPUCullingSmokeTest
          ShaderRegistrySmokeTest
          FixedTimeStepSmokeTest
          ScriptTimeSmokeTest
          AssetPathPortabilitySmokeTest
          WwiseIntegrationSmokeTest
          CiSmokeTestCoverageSmokeTest
          GltfMeshImportSmokeTest
          DX12BindlessSmokeTest
          EnvironmentCollectorTests
          EnvironmentPreflightTests
          EnvironmentCaptureTests
          EnvironmentWerTests

      # -C Release is required on multi-config generators; without it ctest
      # looks in the Debug directory and reports "Unable to find executable".
      #
      # NavMeshTest additionally reads bin/$<CONFIG>/asset/level/1-1.level.json
      # when the build copied the shipped assets there; it prints
      # "(skipped: level file not found)" and still passes when they are absent,
      # so it is safe to run before the asset copy step exists in CI.
      #
      # The four environment_* tests need ZEnvironmentCollector.exe and
      # EnvironmentCaptureTestTarget.exe next to them; CMake knows that (they
      # are add_dependencies of the test targets), so building the four test
      # targets is enough. BUILD_TESTING stays OFF on purpose -- switching it
      # on would register every 3rdparty suite (curl, Jolt, mimalloc, ...) and
      # none of them are built here.
      - name: Run smoke tests
        run: ctest --test-dir build_smoke -C Release --output-on-failure
